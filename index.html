<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arıza Takip Sistemi (Google'sız)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen text-slate-800">

  <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="font-bold text-lg tracking-wide">Arıza Takip Sistemi</h1>
      <div class="flex gap-2">
        <button onclick="switchTab('user')" id="btn-user" class="px-4 py-1.5 rounded-lg text-sm font-semibold bg-amber-500 text-slate-900 shadow">Personel Formu</button>
        <button onclick="switchTab('admin')" id="btn-admin" class="px-4 py-1.5 rounded-lg text-sm font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700">Bakımcı Paneli</button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-4 sm:p-6">

    <!-- PERSONEL EKRANI -->
    <section id="user-view" class="space-y-6">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 max-w-xl mx-auto">
        <h2 class="text-xl font-bold text-slate-900 mb-1">Yeni Arıza Bildirimi</h2>
        <p class="text-sm text-slate-500 mb-6">Lütfen arıza detaylarını eksiksiz doldurun.</p>

        <form id="ariForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Adı Soyadı *</label>
            <input type="text" id="adSoyad" required placeholder="Adınız Soyadınız" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 outline-none">
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Makine Adı (Manuel) *</label>
            <input type="text" id="makineAdi" required placeholder="Örn: Paketleme Hattı 1" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 outline-none">
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Arıza Yeri / Bölge *</label>
            <input type="text" id="arizaYeri" required placeholder="Örn: Dolum Ünitesi / Konveyör" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 outline-none">
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Arıza Açıklaması *</label>
            <textarea id="aciklama" rows="3" required placeholder="Arızanın detayını kısaca yazın..." class="w-full px-4 py-2.5 rounded-xl border border-slate-300 outline-none"></textarea>
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Fotoğraf (İsteğe Bağlı)</label>
            <input type="file" id="photoInput" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100 cursor-pointer">
          </div>

          <button type="submit" id="submitBtn" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold rounded-xl shadow transition">
            Bildirimi Gönder
          </button>
        </form>
      </div>
    </section>

    <!-- BAKIMCI EKRANI -->
    <section id="admin-view" class="hidden space-y-6">
      
      <div id="admin-login" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 max-w-md mx-auto text-center space-y-4">
        <h2 class="text-lg font-bold text-slate-900">Bakımcı Girişi</h2>
        <input type="password" id="adminPassword" placeholder="Şifre (4535)" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 outline-none">
        <button onclick="loginAdmin()" class="w-full py-2.5 bg-slate-900 text-white font-semibold rounded-xl hover:bg-slate-800">Giriş Yap</button>
      </div>

      <div id="admin-dashboard" class="hidden space-y-6">
        <div class="flex justify-between items-center bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
          <span class="text-sm font-bold text-slate-700">Arıza Yönetim Paneli</span>
          <button onclick="loadAdminData()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg">Listeyi Yenile</button>
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div class="bg-amber-50 border-l-4 border-amber-400 p-4 rounded-xl shadow-sm">
            <span class="text-xs font-bold text-amber-700 block uppercase">Bekliyor</span>
            <span id="count-bekliyor" class="text-2xl font-black text-amber-900">0</span>
          </div>
          <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-xl shadow-sm">
            <span class="text-xs font-bold text-blue-700 block uppercase">İşlemde</span>
            <span id="count-islemde" class="text-2xl font-black text-blue-900">0</span>
          </div>
          <div class="bg-emerald-50 border-l-4 border-emerald-500 p-4 rounded-xl shadow-sm">
            <span class="text-xs font-bold text-emerald-700 block uppercase">Tamamlanan</span>
            <span id="count-tamamlandi" class="text-2xl font-black text-emerald-900">0</span>
          </div>
        </div>

        <div class="space-y-4">
          <h3 class="font-bold text-slate-800 text-lg">Gelen Arıza Bildirimleri</h3>
          <div id="arizaListesi" class="space-y-4"></div>
        </div>
      </div>

    </section>
  </main>

  <script>
    // Doğrudan sisteme gömülü anahtar ve veritabanı ID'si
    const API_KEY = "$2a$10$j7OHSjp/OOc1p/kC/PF88uoirJnoAzuF5JEOoiFoE9RYwKOE1eI5G";
    
    // İlk çalıştırmada otomatik bir Bin ID oluşturulur veya aşağıya yazılır
    let BIN_ID = localStorage.getItem("ariza_bin_id") || "";

    window.onload = function() {
      if (!BIN_ID) {
        // Otomatik boş bir bin oluşturalım
        fetch("https://api.jsonbin.io/v3/b", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Master-Key": API_KEY,
            "X-Bin-Private": "true"
          },
          body: JSON.stringify({ arizalar: [] })
        })
        .then(res => res.json())
        .then(data => {
          if(data.metadata && data.metadata.id) {
            localStorage.setItem("ariza_bin_id", data.metadata.id);
            BIN_ID = data.metadata.id;
          }
        })
        .catch(err => console.error(err));
      }
    };

    function switchTab(tab) {
      if(tab === 'user') {
        document.getElementById('user-view').classList.remove('hidden');
        document.getElementById('admin-view').classList.add('hidden');
        document.getElementById('btn-user').className = 'px-4 py-1.5 rounded-lg text-sm font-semibold bg-amber-500 text-slate-900 shadow';
        document.getElementById('btn-admin').className = 'px-4 py-1.5 rounded-lg text-sm font-semibold bg-slate-800 text-slate-300';
      } else {
        document.getElementById('user-view').classList.add('hidden');
        document.getElementById('admin-view').classList.remove('hidden');
        document.getElementById('btn-admin').className = 'px-4 py-1.5 rounded-lg text-sm font-semibold bg-amber-500 text-slate-900 shadow';
        document.getElementById('btn-user').className = 'px-4 py-1.5 rounded-lg text-sm font-semibold bg-slate-800 text-slate-300';
      }
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      let btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "Gönderiliyor...";

      let photoFile = document.getElementById('photoInput').files[0];
      if(photoFile) {
        let reader = new FileReader();
        reader.onload = function(evt) { saveToServer(evt.target.result); };
        reader.readAsDataURL(photoFile);
      } else {
        saveToServer("");
      }
    }

    function saveToServer(photoBase64) {
      if(!BIN_ID) {
        alert("Veritabanı henüz hazırlanıyor, lütfen 5 saniye bekleyip tekrar deneyin.");
        btnStateReset();
        return;
      }

      let yeniAriza = {
        id: "ARZ-" + Math.floor(1000 + Math.random() * 9000),
        adSoyad: document.getElementById('adSoyad').value,
        makine: document.getElementById('makineAdi').value,
        arizaYeri: document.getElementById('arizaYeri').value,
        aciklama: document.getElementById('aciklama').value,
        photoUrl: photoBase64,
        bildirimZamani: new Date().toLocaleString('tr-TR'),
        durum: "Bekliyor",
        mudahaleZamani: "",
        tamamlanmaZamani: ""
      };

      fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { "X-Master-Key": API_KEY }
      })
      .then(res => res.json())
      .then(data => {
        let liste = data.record.arizalar || [];
        liste.unshift(yeniAriza);

        return fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Master-Key": API_KEY
          },
          body: JSON.stringify({ arizalar: liste })
        });
      })
      .then(() => {
        alert("Arıza bildirimi başarıyla kaydedildi.");
        document.getElementById('ariForm').reset();
        btnStateReset();
      })
      .catch(err => {
        alert("Kayıt sırasında hata oluştu: " + err);
        btnStateReset();
      });
    }

    function btnStateReset() {
      let btn = document.getElementById('submitBtn');
      btn.disabled = false;
      btn.innerText = "Bildirimi Gönder";
    }

    function loginAdmin() {
      let pass = document.getElementById('adminPassword').value;
      if(pass === "4535") {
        document.getElementById('admin-login').classList.add('hidden');
        document.getElementById('admin-dashboard').classList.remove('hidden');
        loadAdminData();
      } else {
        alert("Hatalı şifre!");
      }
    }

    function loadAdminData() {
      if(!BIN_ID) return alert("Veritabanı bağlantısı bekleniyor...");

      fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { "X-Master-Key": API_KEY }
      })
      .then(res => res.json())
      .then(data => {
        let arizalar = data.record.arizalar || [];
        let container = document.getElementById('arizaListesi');
        container.innerHTML = '';

        let bekleyen = 0, islemde = 0, tamamlandi = 0;

        if(arizalar.length === 0) {
          container.innerHTML = '<p class="text-sm text-slate-500 bg-white p-4 rounded-xl border border-slate-200 text-center">Henüz arıza kaydı bulunmuyor.</p>';
          return;
        }

        arizalar.forEach((item, index) => {
          if(item.durum === "Bekliyor") bekleyen++;
          if(item.durum === "İşlemde") islemde++;
          if(item.durum === "Tamamlandı") tamamlandi++;

          let borderBgColor = "border-amber-400 bg-amber-50/30";
          let badgeColor = "bg-amber-100 text-amber-800 border-amber-300";
          
          if(item.durum === "İşlemde") {
            borderBgColor = "border-blue-500 bg-blue-50/30";
            badgeColor = "bg-blue-100 text-blue-800 border-blue-300";
          } else if(item.durum === "Tamamlandı") {
            borderBgColor = "border-emerald-500 bg-emerald-50/30";
            badgeColor = "bg-emerald-100 text-emerald-800 border-emerald-300";
          }

          container.innerHTML += `
            <div class="bg-white rounded-xl border-l-4 ${borderBgColor} border-y border-r border-slate-200 p-4 shadow-sm space-y-3">
              <div class="flex justify-between items-start">
                <div>
                  <span class="text-xs font-bold text-slate-400">${item.id}</span>
                  <h4 class="font-bold text-slate-900">${item.makine} - <span class="text-slate-600 font-normal">${item.arizaYeri}</span></h4>
                  <p class="text-xs text-slate-500">Bildiren: <b>${item.adSoyad}</b> | ${item.bildirimZamani}</p>
                </div>
                <span class="px-2.5 py-1 text-xs font-bold border rounded-full ${badgeColor}">${item.durum}</span>
              </div>

              <p class="text-sm text-slate-700 bg-slate-50 p-2.5 rounded-lg border border-slate-100">${item.aciklama}</p>

              ${item.photoUrl ? `<a href="${item.photoUrl}" target="_blank" class="text-xs text-blue-600 font-semibold underline block">📷 Yüklenen Fotoğrafı Gör (Yeni Sekmede Aç)</a>` : ''}

              <div class="flex flex-wrap gap-4 text-xs text-slate-500 pt-1 border-t border-slate-100">
                <span>⏱️ Müdahale: <b>${item.mudahaleZamani || '-'}</b></span>
                <span>✅ Tamamlanma: <b>${item.tamamlanmaZamani || '-'}</b></span>
              </div>

              <div class="flex gap-2 pt-2">
                <button onclick="updateStatus(${index}, 'Bekliyor')" class="px-3 py-1 bg-amber-100 text-amber-800 text-xs font-semibold rounded hover:bg-amber-200">🟡 Bekliyor</button>
                <button onclick="updateStatus(${index}, 'İşlemde')" class="px-3 py-1 bg-blue-100 text-blue-800 text-xs font-semibold rounded hover:bg-blue-200">🔵 İşlemde</button>
                <button onclick="updateStatus(${index}, 'Tamamlandı')" class="px-3 py-1 bg-emerald-100 text-emerald-800 text-xs font-semibold rounded hover:bg-emerald-200">🟢 Tamamlandı</button>
              </div>
            </div>
          `;
        });

        document.getElementById('count-bekliyor').innerText = bekleyen;
        document.getElementById('count-islemde').innerText = islemde;
        document.getElementById('count-tamamlandi').innerText = tamamlandi;
      })
      .catch(err => alert("Veriler yüklenirken hata: " + err));
    }

    function updateStatus(index,
